name: CI - Catalog Service

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "src/catalog/**"

concurrency:
  group: catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  AWS_REGION: ap-southeast-1
  ENVIRONMENT: dev
  CONTEXT_PATH: ./src/catalog
  IMAGE_NAME: devsecops-dev-catalog
  SONAR_PROJECT_KEY: devsecops-retail-store-catalog
  SONAR_ORGANIZATION: huycon2352code

jobs:
  build-secure-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 1. THIẾT LẬP GO VÀ TỐI ƯU CACHE GO MODULES ----
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Bạn có thể đổi thành phiên bản Go tương ứng của dự án (ví dụ: 1.21, 1.23)
          cache: true
          cache-dependency-path: ${{ env.CONTEXT_PATH }}/go.sum

      - name: Compile Go Code
        run: |
          cd ${{ env.CONTEXT_PATH }}
          go mod download
          go build -v ./...
          
      # -------------------------------------------------------------
      # 2. QUÉT MÃ NGUỒN (SAST) VỚI SONARQUBE CLOUD (CHO GO)
      # -------------------------------------------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectBaseDir=${{ env.CONTEXT_PATH }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/*_test.go,**/vendor/**
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*_test.go
            -X

      # ---- 3. TỐI ƯU CACHE CHO DOCKER LAYERS (BUILDKIT) ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------------
      # 4. BUILD DOCKER IMAGE (CHỈ LƯU LOCAL RUNNER)
      # -------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_PATH }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: false 
          load: true  
          cache-from: type=gha 
          cache-to: type=gha,mode=max 

      # -------------------------------------------------------------
      # 5. QUÉT BẢO MẬT DOCKER IMAGE (TRIVY IMAGE)
      # -------------------------------------------------------------
      - name: Run Trivy vulnerability scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'