name: CI - Checkout Service

on:
  # Dev push lên feature branch
  push:
    branches:
      - "feature/**"
    paths:
      - "src/checkout/**"

  # PR vào dev hoặc main
  pull_request:
    branches:
      - "dev"
      - "main"
    paths:
      - "src/checkout/**"

  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ENVIRONMENT: dev
  CONTEXT_PATH: ./src/checkout
  IMAGE_NAME: devsecops-dev-checkout 
  SONAR_PROJECT_KEY: devsecops-retail-store-checkout
  SONAR_ORGANIZATION: huycon2352code

jobs:
  build-secure-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 1. TỐI ƯU CACHE CHO NODE DỰA TRÊN YARN ----
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Hoặc phiên bản Node phù hợp với NestJS v11 của bạn
          cache: 'yarn'      # <--- Tự động cache các thư viện Yarn node_modules
          cache-dependency-path: ${{ env.CONTEXT_PATH }}/yarn.lock

      - name: Install Dependencies & Build NestJS
        run: |
          cd ${{ env.CONTEXT_PATH }}
          # Dùng --immutable thay cho --frozen-lockfile theo chuẩn Yarn v4
          yarn install --immutable 
          # Bỏ cờ --skip-nx-cache đi vì lệnh build chuẩn của NestJS không hỗ trợ cờ này yarn build
          
      # -------------------------------------------------------------
      # 2. QUÉT MÃ NGUỒN (SAST) VỚI SONARQUBE CLOUD (CHO JS/TS)
      # -------------------------------------------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectBaseDir=${{ env.CONTEXT_PATH }}
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -X

      # ---- 3. TỐI ƯU CACHE CHO DOCKER LAYERS (BUILDKIT) ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------------
      # 4. BUILD DOCKER IMAGE (CHỈ LƯU LOCAL RUNNER)
      # -------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_PATH }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: false 
          load: true  
          cache-from: type=gha 
          cache-to: type=gha,mode=max 

      # -------------------------------------------------------------
      # 5. QUÉT BẢO MẬT DOCKER IMAGE (TRIVY IMAGE)
      # -------------------------------------------------------------
      - name: Run Trivy vulnerability scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # Giữ nguyên '0' để không chặn pipeline nếu phát hiện lỗi bảo mật image lúc này
          severity: 'CRITICAL,HIGH'