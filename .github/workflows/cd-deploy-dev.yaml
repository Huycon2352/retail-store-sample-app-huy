name: CD - Deploy Dev (GitOps)

on:
  push:
    branches:
      - dev
    paths:
      - 'src/ui/**'
      - 'src/catalog/**'
      - 'src/checkout/**'
      - 'src/cart/**'
      - 'src/orders/**'
  workflow_dispatch:

# Khai báo env tập trung bằng cách gọi từ GitHub Variables / Secrets
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}

jobs:
  # =============================================================
  # JOB 1: PHÁT HIỆN CÁC SERVICE CÓ THAY ĐỔI TRONG COMMIT / MERGE
  # =============================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui: 'src/ui/**'
            catalog: 'src/catalog/**'
            checkout: 'src/checkout/**'
            cart: 'src/cart/**'
            orders: 'src/orders/**'

  # =============================================================
  # JOB 2: CHỈ BUILD - PUSH - UPDATE TAG (CHẠY SONG SONG QUA MATRIX)
  # =============================================================
  build-and-deploy:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Runtime Variables
        id: vars
        run: |
          echo "path=./src/${{ matrix.service }}" >> $GITHUB_OUTPUT
          echo "ecr_repo=dev-${{ matrix.service }}" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------
      # CẤU HÌNH AWS CREDENTIALS & LOGIN ECR
      # -------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------------------------------------
      # SETUP DOCKER BUILDX VÀ THỪA HƯỞNG CACHE TỪ PR
      # -------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image direct to ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.vars.outputs.path }}
          tags: ${{ env.AWS_ECR_REGISTRY }}/${{ steps.vars.outputs.ecr_repo }}:${{ github.sha }}
          push: true
          cache-from: type=gha 
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # GITOPS TRIGGER: CẬP NHẬT DIRECT VÀO REPO MANIFESTS
      # -------------------------------------------------------------
      - name: Update GitOps Manifest Tag
        run: |
          git clone https://${{ secrets.GITOPS_TOKEN }}@github.com/${{ env.GITOPS_REPO }}.git gitops-repo
          cd gitops-repo
          
          SED_PATH="environments/dev/services/${{ matrix.service }}/values.yaml"
          
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|g" $SED_PATH
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add $SED_PATH
          git commit -m "cd(dev): update image tag for ${{ matrix.service }} to ${{ github.sha }} [skip ci]"
          
          git pull --rebase origin main
          git push origin main