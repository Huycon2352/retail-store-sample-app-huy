name: CI - UI Service

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/ui/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ENVIRONMENT: dev
  CONTEXT_PATH: ./src/ui
  ECR_REPO: devsecops-dev-ui
  SONAR_PROJECT_KEY: devsecops-retail-store-ui
  SONAR_ORGANIZATION: huycon2352code

jobs:
  build-secure-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 1. TỐI ƯU CACHE CHO MAVEN DEPENDENCIES ----
      - name: Set up JDK 21 với Cache của Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven' # <--- Bật tính năng tự động cache thư mục .m2 của GitHub Actions

      - name: Compile Java Code
        run: |
          cd ${{ env.CONTEXT_PATH }}
          chmod +x mvnw
          ./mvnw compile -DskipTests
          
      # -------------------------------------------------------------
      # 1. QUÉT MÃ NGUỒN (SAST) VỚI SONARQUBE CLOUD
      # -------------------------------------------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectBaseDir=${{ env.CONTEXT_PATH }}
            -Dsonar.sources=.
            -Dsonar.java.binaries=target/classes
            -X

      # -------------------------------------------------------------
      # 2. QUÉT BẢO MẬT THƯ MỤC FILE (TRIVY FS)
      # -------------------------------------------------------------
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ env.CONTEXT_PATH }}
          format: 'table'
          exit-code: '1' 
          severity: 'CRITICAL,HIGH'

      # -------------------------------------------------------------
      # *. KẾT NỐI AWS & LOGIN ECR
      # -------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---- 2. TỐI ƯU CACHE CHO DOCKER LAYERS (BUILDKIT) ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # <--- Kích hoạt Buildx để dùng tính năng cache nâng cao

      # -------------------------------------------------------------
      # 3. BUILD DOCKER IMAGE (TẬN DỤNG GITHUB ACTIONS CACHE)
      # -------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6 # <--- Đổi từ lệnh "run" sang action chuẩn để hỗ trợ cache gha
        with:
          context: ${{ env.CONTEXT_PATH }}
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          push: false # Chưa push ngay vì còn bước quét Trivy Image phía dưới
          load: true  # Load image vào bộ nhớ local của máy Runner để Trivy có thể quét được
          cache-from: type=gha # <--- Lấy cache từ kho lưu trữ GitHub Actions mang về dùng
          cache-to: type=gha,mode=max # <--- Đóng gói và đẩy layer mới lên kho cache GitHub Actions

      # -------------------------------------------------------------
      # 4. QUÉT BẢO MẬT DOCKER IMAGE (TRIVY IMAGE)
      # -------------------------------------------------------------
      - name: Run Trivy vulnerability scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1' 
          severity: 'CRITICAL,HIGH'

